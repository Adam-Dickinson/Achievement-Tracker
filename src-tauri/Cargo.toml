[package]
name = "achievement-tracker"
description = "Achievement Tracker desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "achievement_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
at-core.workspace = true
at-store.workspace = true
at-providers.workspace = true
at-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
# M1: tauri-plugin-single-instance, tauri-plugin-autostart, tauri-plugin-notification,
#     tauri "tray-icon" feature, tokio, tracing, tauri-specta.
