<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievement Tracker - Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <meta name="view-transition" content="same-origin">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/8204918a-4869-4cec-ba73-bfe098a3887f" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/aacf7ec7-8501-4806-9cc6-f648f81879ca" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/5b6a84ea-0715-41dd-a09c-2db27bc83791" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/4d4e0785-71b2-4354-9da8-d98c9f6f2ecd" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/f60bd2ff-5180-436e-97a4-61e92c890a8e" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/c9f50582-a106-431f-8aba-e265a2b2985a" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/3b7abd38-f288-40e1-8a11-0b651ab8e5ba" as="document">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            base: '#0B0D12',
            surface1: '#12151C',
            surface2: '#181C25',
            surface3: '#1F2430',
            border: '#262C3A',
            text: '#E8EAF0',
            muted: '#8B93A7',
            subtle: '#5B6478',
            primary: '#F5B942',
            primaryHover: '#FFCB5C',
            onPrimary: '#1A1300',
            success: '#3FB984',
            warning: '#F2A33A',
            danger: '#F0616D',
            info: '#4C9BFF',
            platform: {
              steam: '#66C0F4',
              xbox: '#52B043',
              playstation: '#0070D1',
              epic: '#D4D4D8',
              ubisoft: '#3D8BFF',
              ea: '#FF5A5A',
              emulator: '#A78BFA'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-variant-numeric: tabular-nums; background-color: #0B0D12; color: #E8EAF0; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    html {
        background-color: #0a0a0a;
    }
    @view-transition { navigation: auto; }
    ::view-transition { background-color: #0a0a0a; }

    ::view-transition-old(sidebar),
    ::view-transition-new(sidebar) {
        animation: none;
        mix-blend-mode: normal;
    }

    ::view-transition-old(topbar),
    ::view-transition-new(topbar) {
        animation: none;
        mix-blend-mode: normal;
    }

    ::view-transition-old(main-content) {
        animation: 0.25s ease-out both fade-out;
    }
    ::view-transition-new(main-content) {
        animation: 0.25s ease-in 0.1s both fade-in;
    }

    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    ::view-transition-old(root),
    ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
    }
  </style>
</head>
<body>
  <div class="min-h-screen bg-base flex overflow-hidden">
    
    <!-- Sidebar -->
    <aside style="view-transition-name: sidebar" class="w-[240px] bg-surface1 border-r border-border flex flex-col flex-shrink-0">
      <!-- Header -->
      <div class="h-16 px-6 flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-surface2 border border-border flex items-center justify-center text-primary">
          <iconify-icon icon="lucide:trophy" class="text-xl"></iconify-icon>
        </div>
        <span class="font-display font-semibold text-text truncate">Achievement Tracker</span>
      </div>

      <!-- Nav -->
      <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
        <a href="https://p.superdesign.dev/draft/8204918a-4869-4cec-ba73-bfe098a3887f" id="nav-dashboard" class="flex items-center px-3 py-2.5 rounded-lg text-muted hover:bg-surface2 hover:text-text transition-colors group">
          <iconify-icon icon="lucide:layout-dashboard" class="w-5 h-5 mr-3 group-hover:text-text"></iconify-icon>
          <span class="font-medium">Dashboard</span>
        </a>
        <a href="https://p.superdesign.dev/draft/aacf7ec7-8501-4806-9cc6-f648f81879ca" id="nav-library" class="flex items-center px-3 py-2.5 rounded-lg bg-surface3 text-text relative group">
          <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-5 bg-primary rounded-r-full"></div>
          <iconify-icon icon="lucide:library" class="w-5 h-5 mr-3 text-primary"></iconify-icon>
          <span class="font-medium">Library</span>
        </a>
        <a href="#activity" id="nav-activity" class="flex items-center px-3 py-2.5 rounded-lg text-muted hover:bg-surface2 hover:text-text transition-colors group">
          <iconify-icon icon="lucide:activity" class="w-5 h-5 mr-3 group-hover:text-text"></iconify-icon>
          <span class="font-medium">Activity</span>
        </a>
        <a href="https://p.superdesign.dev/draft/f60bd2ff-5180-436e-97a4-61e92c890a8e" id="nav-accounts" class="flex items-center px-3 py-2.5 rounded-lg text-muted hover:bg-surface2 hover:text-text transition-colors group">
          <iconify-icon icon="lucide:plug" class="w-5 h-5 mr-3 group-hover:text-text"></iconify-icon>
          <span class="font-medium">Accounts</span>
        </a>
        <a href="https://p.superdesign.dev/draft/c9f50582-a106-431f-8aba-e265a2b2985a" id="nav-settings" class="flex items-center px-3 py-2.5 rounded-lg text-muted hover:bg-surface2 hover:text-text transition-colors group">
          <iconify-icon icon="lucide:settings" class="w-5 h-5 mr-3 group-hover:text-text"></iconify-icon>
          <span class="font-medium">Settings</span>
        </a>
      </nav>

      <!-- Footer -->
      <div class="p-4 border-t border-border space-y-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center text-xs text-muted">
            <div class="w-2 h-2 rounded-full bg-success mr-2"></div>
            Synced 2 min ago
          </div>
          <button id="btn-dnd" class="text-muted hover:text-text w-6 h-6 flex items-center justify-center rounded transition-colors">
            <iconify-icon icon="lucide:bell-off" class="text-sm"></iconify-icon>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
      <!-- Topbar -->
      <header style="view-transition-name: topbar" class="h-16 px-8 flex items-center justify-between flex-shrink-0">
        <h1 class="font-display font-semibold text-[28px] leading-[34px] text-text">Library</h1>
        
        <div class="flex items-center gap-4">
          <div class="relative w-64">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <iconify-icon icon="lucide:search" class="text-muted"></iconify-icon>
            </div>
            <input type="text" placeholder="Search games or achievements..." class="w-full h-9 pl-9 pr-12 bg-surface2 border border-border rounded-lg text-sm text-text placeholder:text-subtle focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
              <span class="text-[10px] font-medium text-subtle px-1.5 py-0.5 rounded border border-border bg-surface1">Ctrl+K</span>
            </div>
          </div>
          <button id="btn-sync" class="h-9 px-4 bg-surface2 border border-border rounded-lg text-sm font-medium text-text hover:bg-surface3 transition-colors flex items-center gap-2">
            <iconify-icon icon="lucide:refresh-cw" class="text-muted"></iconify-icon>
            Sync now
          </button>
        </div>
      </header>

      <!-- Scrollable Area -->
      <div style="view-transition-name: main-content" class="flex-1 overflow-y-auto px-8 pb-12">
        <div class="max-w-[1280px] mx-auto space-y-6">

          <!-- Toolbar -->
          <div class="flex flex-wrap items-center justify-between gap-4 py-4">
             <div class="flex items-center gap-2 overflow-x-auto scrollbar-hide">
                <button class="h-8 px-3 bg-surface3 text-text rounded-full text-[13px] font-medium border border-border">All <span class="text-subtle ml-1">214</span></button>
                <button class="h-8 px-3 bg-surface1 hover:bg-surface2 text-muted rounded-full text-[13px] font-medium border border-border transition-colors">Steam <span class="text-subtle ml-1">98</span></button>
                <button class="h-8 px-3 bg-surface1 hover:bg-surface2 text-muted rounded-full text-[13px] font-medium border border-border transition-colors">Xbox <span class="text-subtle ml-1">42</span></button>
                <button class="h-8 px-3 bg-surface1 hover:bg-surface2 text-muted rounded-full text-[13px] font-medium border border-border transition-colors">PlayStation <span class="text-subtle ml-1">51</span></button>
                <button class="h-8 px-3 bg-surface1 hover:bg-surface2 text-muted rounded-full text-[13px] font-medium border border-border transition-colors">Epic <span class="text-subtle ml-1">12</span></button>
             </div>
             <div class="flex items-center gap-4">
                <div class="flex bg-surface2 border border-border rounded-lg p-0.5">
                   <button class="px-3 py-1 bg-surface3 text-text rounded-md text-[13px] font-medium">All</button>
                   <button class="px-3 py-1 text-muted hover:text-text rounded-md text-[13px] font-medium transition-colors">In progress</button>
                   <button class="px-3 py-1 text-muted hover:text-text rounded-md text-[13px] font-medium transition-colors">Completed</button>
                </div>
             </div>
          </div>

          <!-- Grid -->
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-6">
            
            <!-- Game Card 1 -->
            <div class="group cursor-pointer">
               <a href="https://p.superdesign.dev/draft/5b6a84ea-0715-41dd-a09c-2db27bc83791" class="block">
                  <div class="bg-surface1 border border-border rounded-xl p-3 hover:-translate-y-1 hover:border-surface3 transition-all">
                     <div class="aspect-[2/3] w-full rounded-lg bg-surface3 mb-3 overflow-hidden relative">
                         <div class="absolute inset-0 bg-gradient-to-b from-transparent to-base/90"></div>
                         <div class="absolute inset-0 flex items-center justify-center text-muted font-display font-bold text-center px-2 z-10">
                             Elden Ring
                         </div>
                         <div class="absolute bottom-2 left-2 flex gap-1 z-20">
                           <span class="inline-flex h-5 px-1.5 items-center rounded-full bg-[#66C0F4]/14 text-[#66C0F4] text-[10px] font-medium uppercase">
                             Steam
                           </span>
                         </div>
                     </div>
                     <h3 class="text-sm font-semibold text-text truncate mb-2">Elden Ring</h3>
                     <div class="flex items-center justify-between">
                         <div class="flex items-center gap-2">
                           <div class="relative w-8 h-8">
                              <svg class="w-full h-full" viewBox="0 0 32 32">
                                <circle cx="16" cy="16" r="14" fill="none" stroke="#1F2430" stroke-width="4"></circle>
                                <circle cx="16" cy="16" r="14" fill="none" stroke="#3FB984" stroke-width="4" stroke-dasharray="87.9" stroke-dashoffset="0" stroke-linecap="round" class="-rotate-90 origin-center"></circle>
                              </svg>
                           </div>
                           <div class="flex flex-col">
                             <span class="text-xs font-semibold text-success">100%</span>
                             <span class="text-[10px] text-muted">42 / 42</span>
                           </div>
                         </div>
                     </div>
                  </div>
               </a>
            </div>

             <!-- Game Card 2 (Linked) -->
             <div class="group cursor-pointer">
               <a href="https://p.superdesign.dev/draft/5b6a84ea-0715-41dd-a09c-2db27bc83791" class="block">
                  <div class="bg-surface1 border border-border rounded-xl p-3 hover:-translate-y-1 hover:border-surface3 transition-all">
                     <div class="aspect-[2/3] w-full rounded-lg bg-surface3 mb-3 overflow-hidden relative">
                         <div class="absolute inset-0 bg-gradient-to-b from-transparent to-base/90"></div>
                         <div class="absolute inset-0 flex items-center justify-center text-muted font-display font-bold text-center px-2 z-10">
                             Hades
                         </div>
                         <div class="absolute bottom-2 left-2 flex gap-1 z-20 flex-wrap">
                           <span class="inline-flex h-5 px-1.5 items-center rounded-full bg-[#66C0F4]/14 text-[#66C0F4] text-[10px] font-medium uppercase">
                             Steam
                           </span>
                           <span class="inline-flex h-5 px-1.5 items-center rounded-full bg-[#52B043]/14 text-[#52B043] text-[10px] font-medium uppercase">
                             Xbox
                           </span>
                         </div>
                     </div>
                     <h3 class="text-sm font-semibold text-text truncate mb-2">Hades</h3>
                     <div class="flex items-center justify-between">
                         <div class="flex items-center gap-2">
                           <div class="relative w-8 h-8">
                              <svg class="w-full h-full" viewBox="0 0 32 32">
                                <circle cx="16" cy="16" r="14" fill="none" stroke="#1F2430" stroke-width="4"></circle>
                                <circle cx="16" cy="16" r="14" fill="none" stroke="#F5B942" stroke-width="4" stroke-dasharray="87.9" stroke-dashoffset="22" stroke-linecap="round" class="-rotate-90 origin-center"></circle>
                              </svg>
                           </div>
                           <div class="flex flex-col">
                             <span class="text-xs font-semibold text-text">75%</span>
                             <span class="text-[10px] text-muted">36 / 49</span>
                           </div>
                         </div>
                     </div>
                  </div>
               </a>
            </div>

          </div>

          <!-- Footer -->
          <div class="pt-8 text-center">
             <p class="text-sm text-subtle">Showing 12 of 214 games</p>
          </div>

        </div>
      </div>
    </main>
  </div>
</body>
</html>
