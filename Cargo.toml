[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/providers",
    "crates/sync",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

[workspace.dependencies]
# internal
at-core = { path = "crates/core" }
at-store = { path = "crates/store" }
at-providers = { path = "crates/providers" }
at-sync = { path = "crates/sync" }

# shared external
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
